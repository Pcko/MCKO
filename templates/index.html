{% extends "base.html" %}

{% block title %}Minecraft Control{% endblock %}
{% block head %}
<script>
    function draggableTitlebar(targetId) {
        const target = document.getElementById(targetId);
        if (!target) return;

        let dragging = false;
        let previousX = 0;
        let previousY = 0;

        target.addEventListener("pointerdown", (event) => {
            const rect = target.getBoundingClientRect();

            const titlebarHeight = parseFloat(
                getComputedStyle(document.documentElement)
                    .getPropertyValue("--titlebar-height")
            ) || 40;

            const clickedInsideTitlebar =
                event.clientY >= rect.top &&
                event.clientY <= rect.top + titlebarHeight;

            if (!clickedInsideTitlebar) {
                return;
            }

            dragging = true;
            previousX = event.pageX;
            previousY = event.pageY;

            target.setPointerCapture(event.pointerId);
            event.preventDefault();
        });

        target.addEventListener("pointermove", (event) => {
            if (!dragging) return;

            const dx = event.pageX - previousX;
            const dy = event.pageY - previousY;

            const currentLeft = parseFloat(target.style.left || "0");
            const currentTop = parseFloat(target.style.top || "0");

            target.style.left = `${currentLeft + dx}px`;
            target.style.top = `${currentTop + dy}px`;

            previousX = event.pageX;
            previousY = event.pageY;
        });

        target.addEventListener("pointerup", () => {
            dragging = false;
        });

        target.addEventListener("pointercancel", () => {
            dragging = false;
        });
    }

    window.addEventListener("load", () => {
        draggableTitlebar("term");
    });
</script>
{% endblock %}
{% block content %}
<main class="page">
    <section id="term" class="card" data-title-left="mcko@mc-server: ~/management" data-title-right="v0.1">

        <header class="card-header">
            <h1>Minecraft Server Management</h1>
        </header>

        {% include "status_box.html" %}

        <div class="panel">
            <label for="secret">Server Secret:</label>
            <input id="secret" name="secret" type="password" placeholder="Enter server secret" required />
        </div>

        <div class="server-actions">
            <button type="button" class="success-button" hx-include="#secret" hx-post="/start" hx-target="#message"
                hx-target-error="#message" hx-swap="innerHTML">
                Start Server
            </button>

            <button type="button" hx-include="#secret" hx-post="/restart" hx-target="#message"
                hx-target-error="#message" hx-swap="innerHTML" disabled>
                Restart Server
            </button>

            <button type="button" class="danger-button" hx-include="#secret" hx-post="/stop" hx-target="#message"
                hx-target-error="#message" hx-swap="innerHTML">
                Stop Server
            </button>
        </div>


        <div id="message" class="message">

        </div>
    </section>
</main>
{% endblock %}
