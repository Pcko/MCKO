<div id="status-box" class="status-box" hx-get="/status" hx-trigger="every 5s" hx-swap="outerHTML" aria-live="polite">
    <div class="status-box__main">
        <label>Status:</label>

        <span class="status-dot {{ state.css_class() }}"></span>

        <div class="status-content">
            <span class="status-text">{{ state.label() }}</span>
            {% if state.label() == "Running" %}
            <p>World online · accepting players</p>
            {% else %}
            <p>World offline · run to play</p>
            {% endif %}
        </div>
    </div>

    <div class="status-box__aside status-meta">
        <div class="small-card">
            <span>Uptime</span>
            <strong>{{ uptime }}</strong>
        </div>

        <div class="small-card">
            <span>Port</span>
            <strong>{{ port }}</strong>
        </div>

        <div class="small-card">
            <span>Player</span>
            <strong>{{ player_count }}</strong>
        </div>

        <div class="small-card">
            <span>RAM</span>
            <strong>{{ memory_usage }}</strong>
        </div>
    </div>
</div>
